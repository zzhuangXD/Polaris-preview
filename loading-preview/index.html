    <style>
/* Polaris motion v2: approved static geometry is restored by the engine at phase 0. */
.polaris-loading {
  --polaris-loading-bg: #101B2C;
  --polaris-loading-ink: #F0F4F5;
  --polaris-loading-cabin: #4D7895;
  --polaris-loading-text: #F0F4F5;
  --polaris-loading-muted: #C1CEDA;
  --polaris-loading-selection: #3D617D;
  --polaris-loading-selection-text: #F0F4F5;
  --polaris-loading-focus: #B7D8EF;
  position: relative;
  display: grid;
  place-items: center;
  box-sizing: border-box;
  min-width: 0;
  min-height: 100vh;
  min-height: 100svh;
  min-height: 100dvh;
  padding: 32px 24px;
  padding-top: max(32px, env(safe-area-inset-top));
  padding-right: max(24px, env(safe-area-inset-right));
  padding-bottom: max(32px, env(safe-area-inset-bottom));
  padding-left: max(24px, env(safe-area-inset-left));
  overflow: hidden;
  background: var(--polaris-loading-bg);
  color: var(--polaris-loading-text);
  color-scheme: dark;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.polaris-loading[data-theme='light'] {
  --polaris-loading-bg: #EEF3F6;
  --polaris-loading-ink: #4D7895;
  --polaris-loading-cabin: #C5D5DB;
  --polaris-loading-text: #172B3D;
  --polaris-loading-muted: #526E84;
  --polaris-loading-selection: #C2DCEB;
  --polaris-loading-selection-text: #172B3D;
  --polaris-loading-focus: #335F7F;
  color-scheme: light;
}

.polaris-loading[data-overlay='true'] {
  position: fixed;
  inset: 0;
  z-index: 1000;
}

.polaris-loading__content {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: min(100%, 32rem);
  min-width: 0;
}

.polaris-loading__brand {
  display: block;
  width: min(78vw, 320px);
  max-width: 100%;
  height: auto;
  overflow: visible;
  color: var(--polaris-loading-ink);
}

.polaris-loading__status {
  max-width: 100%;
  margin-top: 32px;
  text-align: center;
}

.polaris-loading__message {
  margin: 0;
  color: var(--polaris-loading-text);
  font-size: 16px;
  font-weight: 600;
  line-height: 1.5;
  letter-spacing: 0;
}

.polaris-loading__detail {
  margin: 8px 0 0;
  color: var(--polaris-loading-muted);
  font-size: 13px;
  line-height: 1.6;
  letter-spacing: 0;
}

.polaris-loading__star,
.polaris-loading__wave {
  transform-box: fill-box;
}

.polaris-loading__boat {
  /* SVG rotate(... 56 100) already owns the pivot; do not apply a second origin. */
  transform-box: view-box;
  transform-origin: 0 0;
  will-change: transform;
}

.polaris-loading__brand[data-motion-state='reduced'] .polaris-loading__boat,
.polaris-loading__brand[data-motion-state='paused'] .polaris-loading__boat,
.polaris-loading__brand[data-motion-state='hidden'] .polaris-loading__boat {
  will-change: auto;
}

.polaris-loading ::selection {
  background: var(--polaris-loading-selection);
  color: var(--polaris-loading-selection-text);
}

.polaris-loading :focus-visible {
  outline: 2px solid var(--polaris-loading-focus);
  outline-offset: 3px;
}

@media (max-width: 600px) {
  .polaris-loading {
    padding: 24px 20px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-right: max(20px, env(safe-area-inset-right));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    padding-left: max(20px, env(safe-area-inset-left));
  }

  .polaris-loading__brand {
    width: min(80vw, 280px);
  }
}

@media (max-height: 520px) and (orientation: landscape) {
  .polaris-loading__brand {
    width: min(52vh, 260px);
  }

  .polaris-loading__status {
    margin-top: 20px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .polaris-loading__boat {
    will-change: auto;
  }
}

/* Preview-only chrome; the production surface is the main element above. */
:root,
.preview-body {
  margin: 0;
  min-width: 0;
  background: #101B2C;
}

:root[data-theme='light'],
:root[data-theme='light'] .preview-body {
  background: #EEF3F6;
}

.preview-controls {
  position: fixed;
  right: max(16px, env(safe-area-inset-right));
  bottom: max(16px, env(safe-area-inset-bottom));
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
}

.preview-controls[hidden] {
  display: none;
}

.preview-controls__label {
  margin-right: 4px;
  color: #C1CEDA;
  font-size: 12px;
  line-height: 1.4;
}

.preview-control {
  min-height: 36px;
  box-sizing: border-box;
  appearance: none;
  border: 1px solid #344D65;
  border-radius: 10px;
  padding: 8px 12px;
  background: #192A3E;
  color: #F0F4F5;
  cursor: pointer;
  font: inherit;
  font-size: 12px;
  line-height: 1.4;
}

.preview-control:hover {
  background: #263E55;
}

.preview-control:focus-visible {
  outline: 2px solid #B7D8EF;
  outline-offset: 3px;
}

:root[data-theme='light'] .preview-controls__label {
  color: #40596F;
}

:root[data-theme='light'] .preview-control {
  border-color: #D0DDE7;
  background: #FFFFFF;
  color: #172B3D;
}

:root[data-theme='light'] .preview-control:hover {
  background: #E3EDF4;
}

:root[data-theme='light'] .preview-control:focus-visible {
  outline-color: #335F7F;
}

@media (max-width: 480px) {
  .preview-controls {
    right: max(16px, env(safe-area-inset-right));
    left: max(16px, env(safe-area-inset-left));
    justify-content: center;
  }

  .preview-controls__label {
    display: none;
  }
}

            wavePhase: theta,
            waveWindow: [WAVE.x0, WAVE.x1],
            // Keep full upward travel; ease only the dipping half to avoid crossing the wave stroke.
    boatHeave: number(-3.2 * Math.sin(theta) - 1.5 * Math.max(0, -Math.sin(theta)) ** 2),
            boatRoll: number(1.5 * Math.sin(theta) + 0.3 * Math.sin(theta * 2)),
          };
        };

        const starPath = (phase) => {
          const { starTips } = valuesAt(phase);
          const top = [STAR_CENTER.x, STAR_CENTER.y - STAR_RADIUS * starTips[0]];
          const right = [STAR_CENTER.x + STAR_RADIUS * starTips[1], STAR_CENTER.y];
          const bottom = [STAR_CENTER.x, STAR_CENTER.y + STAR_RADIUS * starTips[2]];
          const left = [STAR_CENTER.x - STAR_RADIUS * starTips[3], STAR_CENTER.y];
          const c = STAR_CONTROLS;
          return `M ${point(...top)} C ${point(...c[0])} ${point(...c[1])} ${point(...right)} C ${point(...c[2])} ${point(...c[3])} ${point(...bottom)} C ${point(...c[4])} ${point(...c[5])} ${point(...left)} C ${point(...c[6])} ${point(...c[7])} ${point(...top)} Z`;
        };

        const waveY = (x, phase) => WAVE.y - WAVE.amplitude * Math.sin((x - WAVE.x0) * TAU / WAVE.wavelength - phase);
        const waveDerivative = (x, phase) => -WAVE.amplitude * TAU / WAVE.wavelength * Math.cos((x - WAVE.x0) * TAU / WAVE.wavelength - phase);
        const wavePath = (phase) => {
          const step = (WAVE.x1 - WAVE.x0) / WAVE.segments;
          let path = `M ${point(WAVE.x0, waveY(WAVE.x0, phase))}`;
          for (let index = 0; index < WAVE.segments; index += 1) {
            const start = WAVE.x0 + step * index;
            const end = start + step;
            const startY = waveY(start, phase);
            const endY = waveY(end, phase);
            const c1x = start + step / 3;
            const c2x = end - step / 3;
            const c1y = startY + waveDerivative(start, phase) * step / 3;
            const c2y = endY - waveDerivative(end, phase) * step / 3;
            path += ` C ${point(c1x, c1y)} ${point(c2x, c2y)} ${point(end, endY)}`;
          }
          return path;
        };

        const createMotion = (svg, { paused = false, hidden = false, reducedMotion = false, initialPhase = 0 } = {}) => {
          const star = svg.querySelector('[data-motion-star]');
          const wave = svg.querySelector('[data-motion-wave]');
          const boat = svg.querySelector('[data-motion-boat]');
          const staticStar = star.getAttribute('d') || '';
          const staticWave = wave.getAttribute('d') || '';
          let phase = normalizePhase(initialPhase);
          let isPaused = paused;
          let isHidden = hidden;
          let isReduced = reducedMotion;
          let destroyed = false;
          let frame = null;
          let previousTime = null;

          const updateState = () => {
            svg.dataset.motionState = destroyed ? 'destroyed' : isReduced ? 'reduced' : isHidden ? 'hidden' : isPaused ? 'paused' : 'running';
          };
          const renderStatic = () => {
            phase = 0;
            star.setAttribute('d', staticStar);
            wave.setAttribute('d', staticWave);
            boat.removeAttribute('transform');
            svg.dataset.motionPhase = '0';
            svg.dataset.starTips = '1,1,1,1';
            svg.dataset.wavePhase = '0';
            svg.dataset.waveWindow = '25..93.8';
            svg.dataset.boatHeave = '0';
            svg.dataset.boatRoll = '0';
          };
          const render = () => {
            if (isReduced || phase === 0) {
              renderStatic();
              return;
            }
            const values = valuesAt(phase);
            star.setAttribute('d', starPath(phase));
            wave.setAttribute('d', wavePath(values.wavePhase));
            boat.setAttribute('transform', `translate(0 ${number(values.boatHeave)}) rotate(${number(values.boatRoll)} 56 100)`);
            svg.dataset.motionPhase = values.phase.toFixed(4);
            svg.dataset.starTips = values.starTips.join(',');
            svg.dataset.wavePhase = values.wavePhase.toFixed(5);
            svg.dataset.waveWindow = '25..93.8';
            svg.dataset.boatHeave = String(values.boatHeave);
            svg.dataset.boatRoll = String(values.boatRoll);
          };
          const canRun = () => !destroyed && !isPaused && !isHidden && !isReduced;
          const tick = (time) => {
            frame = null;
            if (!canRun()) {
              previousTime = null;
              return;
            }
            if (previousTime === null) previousTime = time;
            const elapsed = Math.min(100, Math.max(0, time - previousTime));
            previousTime = time;
            phase = normalizePhase(phase + elapsed / DURATION);
            render();
            frame = requestAnimationFrame(tick);
          };
          const sync = () => {
            updateState();
            if (canRun()) {
              if (frame === null) {
                previousTime = null;
                frame = requestAnimationFrame(tick);
              }
            } else if (frame !== null) {
              cancelAnimationFrame(frame);
              frame = null;
              previousTime = null;
            }
          };
          const controller = {
            setPaused(value) { isPaused = Boolean(value); sync(); },
            setPageHidden(value) { isHidden = Boolean(value); previousTime = null; sync(); },
            setReducedMotion(value) { isReduced = Boolean(value); if (isReduced) renderStatic(); sync(); },
            setPhase(value) {
              if (!Number.isFinite(value)) return;
              phase = isReduced ? 0 : normalizePhase(value);
              render();
              updateState();
            },
            getState() {
              return { ...valuesAt(phase), running: canRun(), paused: isPaused, hidden: isHidden, reducedMotion: isReduced };
            },
            play() { isPaused = false; sync(); },
            pause() { isPaused = true; sync(); },
            reset() { renderStatic(); previousTime = null; updateState(); },
            destroy() {
              destroyed = true;
              if (frame !== null) cancelAnimationFrame(frame);
              frame = null;
              previousTime = null;
              updateState();
            },
          };
          render();
          sync();
          return controller;
        };

        const surface = document.getElementById('loading-preview');
        const svg = document.getElementById('loading-brand');
        const controls = document.getElementById('preview-controls');
        const themeButton = document.querySelector('[data-preview-theme]');
        const pauseButton = document.querySelector('[data-preview-pause]');
        const params = new URLSearchParams(window.location.search);
        const requestedPhase = Number(params.get('phase'));
        const hasPhase = params.has('phase') && Number.isFinite(requestedPhase);
        const media = window.matchMedia('(prefers-reduced-motion: reduce)');
        let paused = params.get('paused') === '1' || hasPhase;
        const controller = createMotion(svg, {
          paused,
          hidden: document.hidden,
          reducedMotion: media.matches,
          initialPhase: hasPhase ? requestedPhase : 0,
        });
        window.__polarisMotionV2 = controller;

        const setTheme = (theme) => {
          surface.dataset.theme = theme;
          document.documentElement.dataset.theme = theme;
          const light = theme === 'light';
          themeButton.textContent = light ? '切换深色' : '切换浅色';
          themeButton.setAttribute('aria-pressed', String(light));
        };
        const setPaused = (nextPaused) => {
          paused = nextPaused;
          surface.dataset.paused = String(paused);
          controller.setPaused(paused);
          pauseButton.textContent = paused ? '继续动画' : '暂停动画';
          pauseButton.setAttribute('aria-pressed', String(paused));
        };
        const onMotionPreference = () => controller.setReducedMotion(media.matches);
        const onVisibility = () => {
          surface.dataset.pageHidden = document.hidden ? 'true' : 'false';
          controller.setPageHidden(document.hidden);
        };

        setTheme(params.get('theme') === 'light' ? 'light' : 'dark');
        setPaused(paused);
        onMotionPreference();
        onVisibility();
        if (params.get('clean') === '1') controls.hidden = true;
        themeButton.addEventListener('click', () => setTheme(surface.dataset.theme === 'light' ? 'dark' : 'light'));
        pauseButton.addEventListener('click', () => setPaused(!paused));
        if (media.addEventListener) media.addEventListener('change', onMotionPreference);
        else media.addListener(onMotionPreference);
        document.addEventListener('visibilitychange', onVisibility);
        window.addEventListener('pagehide', () => controller.destroy(), { once: true });
      })();
    </script>
  </body>
</html>
